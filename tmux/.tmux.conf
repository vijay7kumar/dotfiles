# ===========================
# ThePrimeagen-style tmux config
# ===========================

# Change prefix to Ctrl+a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Terminal settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Mouse support
set -g mouse on

# Vi mode
setw -g mode-keys vi

# Vi-style copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes with Ctrl+hjkl
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Quick tool launchers
bind g new-window -n 'lazygit' lazygit
bind d new-window -n 'lazydocker' lazydocker
bind b new-window -n 'btop' btop

# Sessionizer
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Don't rename windows automatically
set-option -g allow-rename off

# Reduce escape time (for vim)
set -sg escape-time 0

# History limit
set -g history-limit 50000

# Status bar position
set -g status-position top

# ===========================
# STATUS BAR STYLING
# ===========================
# Rose Pine inspired colors
set -g status-style 'bg=#191724 fg=#e0def4'
set -g status-left '#[fg=#191724,bg=#c4a7e7,bold] #S #[fg=#c4a7e7,bg=#191724] '
set -g status-right '#[fg=#6e6a86]%H:%M #[fg=#e0def4]%d-%b-%Y '
set -g status-left-length 30
set -g status-right-length 50

# Window status
setw -g window-status-current-format '#[fg=#191724,bg=#31748f,bold] #I:#W #[fg=#31748f,bg=#191724]'
setw -g window-status-format '#[fg=#6e6a86] #I:#W '

# Pane borders
set -g pane-border-style 'fg=#6e6a86'
set -g pane-active-border-style 'fg=#c4a7e7'

# Message style
set -g message-style 'fg=#e0def4 bg=#26233a'

# ===========================
# PLUGINS (TPM)
# ===========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
