# Generated by matugen from ~/.config/matugen/templates/starship.toml
# Edit the TEMPLATE, not this file — it is rewritten on every wallpaper change.
add_newline = false
palette = "wallpaper"

format = "$directory$git_branch$git_status$character"

[palettes.wallpaper]
accent  = "{{colors.primary.default.hex}}"
accent2 = "{{colors.tertiary.default.hex}}"
text    = "{{colors.on_surface.default.hex}}"
warn    = "{{colors.error.default.hex}}"

[directory]
truncation_length = 2
truncate_to_repo = true
format = "[$path](bold accent)"

[git_branch]
symbol = ""
format = " [$branch](bold accent2)"

[git_status]
format = "[$all_status$ahead_behind](bold warn)"

[character]
success_symbol = " [❯](bold text)"
error_symbol = " [❯](bold warn)"
