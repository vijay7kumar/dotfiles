# ─────────────────────────────────────────────────────────────
#  Hyprlock — follows the current wallpaper + matugen colours
#  Avatar: square crop of the current wallpaper
# ─────────────────────────────────────────────────────────────
$jay_cache_folder = $HOME/.cache/jay/hyprland-dotfiles
source = colors.conf

$font      = Fira Sans
$font_bold = Fira Sans Black
$mono      = JetBrainsMono Nerd Font

general {
    ignore_empty_input = true
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 5, easeOut
    animation = fadeOut, 1, 5, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

# ── Background: current wallpaper, extra blur + darken ──────
background {
    monitor =
    path = $jay_cache_folder/blurred_wallpaper.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.65
    contrast = 1.0
    vibrancy = 0.2
}

# ── Clock ────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $on_surface
    font_size = 130
    font_family = $font_bold
    position = 0, 260
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = $shadow
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $primary
    font_size = 22
    font_family = $font
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_color = $shadow
}

# ── Avatar + greeting ────────────────────────────────────────
image {
    monitor =
    path = $jay_cache_folder/square_wallpaper.png
    size = 120
    rounding = -1
    border_size = 3
    border_color = $primary
    position = 0, 20
    halign = center
    valign = center
    shadow_passes = 2
    shadow_color = $shadow
}

label {
    monitor =
    text = Welcome back, <b>$USER</b>
    color = $on_surface
    font_size = 16
    font_family = $font
    position = 0, -70
    halign = center
    valign = center
}

# ── Password field ───────────────────────────────────────────
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = $primary
    inner_color = rgba(0, 0, 0, 0.35)
    font_color = $on_surface
    font_family = $font
    fade_on_empty = false
    placeholder_text = <i>󰌾  Password</i>
    hide_input = false
    rounding = -1
    check_color = $tertiary
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $tertiary
    position = 0, -140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_color = $shadow
}

# ── Now playing (hidden when nothing plays) ──────────────────
label {
    monitor =
    text = cmd[update:2000] sh -c 't=$(playerctl metadata title 2>/dev/null) && echo "󰎆  $(playerctl metadata artist 2>/dev/null) — $t" | cut -c1-70'
    color = $on_surface_variant
    font_size = 13
    font_family = $font
    position = 0, 60
    halign = center
    valign = bottom
}

# ── Battery + keyboard layout ────────────────────────────────
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)%"
    color = $on_surface_variant
    font_size = 13
    font_family = $mono
    position = -30, 30
    halign = right
    valign = bottom
}

label {
    monitor =
    text = $LAYOUT
    color = $on_surface_variant
    font_size = 13
    font_family = $mono
    position = 30, 30
    halign = left
    valign = bottom
}
