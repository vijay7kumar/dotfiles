<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<!-- Colours come from colors.css, regenerated by matugen on every wallpaper change.
     Edit the LINKS array at the bottom to change the shortcuts. -->
<link rel="stylesheet" href="colors.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Fira Sans", system-ui, sans-serif;
    color: var(--text, #e8e1e1);
    background: var(--bg, #100e0e);
    display: grid; place-items: center;
    overflow: hidden;
  }
  /* blurred current wallpaper, written by the wallpaper script */
  .backdrop {
    position: fixed; inset: -40px; z-index: -1;
    background: url("../../.cache/jay/hyprland-dotfiles/blurred_wallpaper.png") center / cover no-repeat;
    filter: brightness(0.45) saturate(1.1);
  }
  main { width: min(880px, 92vw); display: grid; gap: 28px; justify-items: center; }
  .hero { display: flex; align-items: center; gap: 28px; }
  .art {
    width: 132px; height: 132px; border-radius: 50%; flex: none;
    background: var(--card) url("../../.cache/jay/hyprland-dotfiles/square_wallpaper.png") center / cover;
    border: 3px solid var(--accent, #dac0c9);
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .clock { font-size: clamp(64px, 11vw, 120px); font-weight: 900; line-height: 1; letter-spacing: -2px;
           font-variant-numeric: tabular-nums; text-shadow: 0 6px 30px rgba(0,0,0,.5); }
  .date { margin-top: 8px; font-size: 20px; color: var(--accent, #dac0c9); font-weight: 500; }
  .greet { margin-top: 4px; font-size: 15px; color: var(--muted, #cbc5c6); }
  form { width: 100%; }
  input {
    width: 100%; padding: 16px 24px; font: inherit; font-size: 17px;
    color: var(--text); background: color-mix(in srgb, var(--card, #221f20) 78%, transparent);
    border: 2px solid var(--outline, #4d4447); border-radius: 999px; outline: none;
    backdrop-filter: blur(14px); transition: border-color .15s;
  }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--accent); }
  .links { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .links a {
    display: flex; align-items: center; gap: 10px; padding: 14px 18px;
    color: var(--text); text-decoration: none; font-weight: 500;
    background: color-mix(in srgb, var(--card, #221f20) 72%, transparent);
    border: 1px solid var(--outline, #4d4447); border-radius: 16px;
    backdrop-filter: blur(14px); transition: transform .12s, background .12s, border-color .12s;
  }
  .links a:hover, .links a:focus-visible { transform: translateY(-2px); background: var(--card-hover); border-color: var(--accent); outline: none; }
  .links .k { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none;
              font-size: 13px; font-weight: 700; background: var(--accent); color: var(--on-accent, #3d2c33); }
  @media (max-width: 640px) { .hero { flex-direction: column; text-align: center; } .links { grid-template-columns: repeat(2, 1fr); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="backdrop"></div>
<main>
  <div class="hero">
    <div class="art" role="img" aria-label="Current wallpaper"></div>
    <div>
      <div class="clock" id="clock">00:00</div>
      <div class="date" id="date"></div>
      <div class="greet" id="greet"></div>
    </div>
  </div>
  <form action="https://www.google.com/search" method="get" role="search">
    <input name="q" type="search" placeholder="Search the web…  (press a number key for a shortcut)" autofocus autocomplete="off" aria-label="Search the web">
  </form>
  <nav class="links" id="links" aria-label="Shortcuts"></nav>
</main>
<script>
  // ── Edit these ─────────────────────────────────────────────
  const LINKS = [
    ["YouTube",   "https://www.youtube.com"],
    ["GitHub",    "https://github.com"],
    ["Gmail",     "https://mail.google.com"],
    ["Reddit",    "https://www.reddit.com/r/unixporn"],
    ["Arch Wiki", "https://wiki.archlinux.org"],
    ["AUR",       "https://aur.archlinux.org"],
    ["MyAnimeList","https://myanimelist.net"],
    ["Claude",    "https://claude.ai"],
  ];
  // ───────────────────────────────────────────────────────────
  const nav = document.getElementById("links");
  LINKS.forEach(([name, url], i) => {
    const a = document.createElement("a"); a.href = url;
    const k = document.createElement("span"); k.className = "k"; k.textContent = i + 1;
    a.append(k, document.createTextNode(name)); nav.append(a);
  });
  function tick() {
    const d = new Date(), h = d.getHours();
    document.getElementById("clock").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    document.getElementById("date").textContent = d.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
    document.getElementById("greet").textContent =
      h < 5 ? "Still up?" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : h < 22 ? "Good evening" : "Good night";
  }
  tick(); setInterval(tick, 10000);
  // number keys open shortcuts when the search box is empty
  const box = document.querySelector("input");
  document.addEventListener("keydown", e => {
    if (box.value || e.ctrlKey || e.altKey || e.metaKey) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= LINKS.length) { e.preventDefault(); location.href = LINKS[n - 1][1]; }
  });
</script>
</body>
</html>
